<!doctype html>
<html lang="ru">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#f6f1e4">
<meta name="referrer" content="no-referrer">
<meta name="robots" content="noindex">
<title>Угадайка — Monkey School</title>
<link rel="icon" href="icon.svg" type="image/svg+xml">
<link rel="stylesheet" href="style.css">
</head>
<body>
<header class="top">
  <div class="brand">
    <img src="icon.svg" alt="" width="30" height="30">
    <div><b>Угадайка</b><small>обезьянка угадывает твой рисунок</small></div>
  </div>
  <div class="seg" id="mode" role="group" aria-label="Режим">
    <button data-m="free" class="on" type="button">Свободно</button><button data-m="game" type="button">Игра</button>
  </div>
</header>

<main>
  <div class="game-bar card" id="game-bar" hidden>
    <div class="task">Нарисуй: <b id="g-word">…</b></div>
    <div class="game-stat"><span>⏱ <b id="g-timer">20</b></span><span>очки <b id="g-score">0</b></span><span>серия <b id="g-streak">0</b></span></div>
  </div>

  <div class="stage">
    <div class="paper-wrap">
      <canvas id="canvas" class="paper" aria-label="Холст для рисования"></canvas>
      <div class="hint" id="hint">Рисуй мышью, пером или пальцем</div>
      <div class="big-card" id="big-card" hidden><div class="big-emoji" id="big-emoji">🙈</div><div class="big-text" id="big-text"></div></div>
    </div>

    <aside class="side">
      <div class="verdict card" id="verdict"><span class="muted">Нарисуй что-нибудь…</span></div>
      <ol class="top5" id="top5"></ol>
      <div class="sees card">
        <img id="preview" alt="" width="64" height="64">
        <div><b>что видит модель</b><span>64×64</span><span id="ms" class="muted"></span></div>
      </div>
    </aside>
  </div>

  <div class="actions">
    <button id="undo" class="btn" type="button">Отменить</button>
    <button id="clear" class="btn" type="button">Очистить</button>
    <button id="start" class="btn primary" type="button" hidden>Играть!</button>
  </div>
  <p class="note" id="status">Загружаю модель…</p>
  <p class="foot">Всё считается прямо в браузере (onnxruntime-web). Ничего не отправляется.</p>
</main>

<script src="core.js"></script>
<script src="sketch.js"></script>
<script type="module" src="app.js"></script>
</body>
</html>
